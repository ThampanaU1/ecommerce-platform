<div class="page-container">
  <h1>My Profile</h1>

  <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="success-banner">{{ successMessage }}</div>

  <div *ngIf="isLoading">Loading profile...</div>

  <div class="profile-box" *ngIf="!isLoading">
    <form (ngSubmit)="onSave()">
      <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" [(ngModel)]="name" required />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [value]="email" disabled />
      </div>

      <div class="form-group">
        <label>Account Type</label>
        <div class="roles">
          <span class="role-badge" *ngFor="let role of roles">{{ role }}</span>
        </div>
      </div>

      <button type="submit" [disabled]="isSaving">
        {{ isSaving ? 'Saving...' : 'Save Changes' }}
      </button>
    </form>

    <div class="quick-links">
      <a routerLink="/orders">View My Orders →</a>
    </div>
  </div>
</div>
