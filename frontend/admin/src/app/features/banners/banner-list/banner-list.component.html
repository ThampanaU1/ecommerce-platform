<div class="page-container">
  <div class="page-header">
    <h1>Homepage Banners</h1>
    <button (click)="showForm = !showForm">{{ showForm ? 'Cancel' : '+ Add Banner' }}</button>
  </div>

  <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="success-banner">{{ successMessage }}</div>

  <div class="create-form" *ngIf="showForm">
    <form (ngSubmit)="onCreate()">
      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" [(ngModel)]="formData.title" placeholder="e.g. Summer Sale" />
      </div>
      <div class="form-group">
        <label>Image URL</label>
        <input type="text" name="imageUrl" [(ngModel)]="formData.imageUrl" required placeholder="https://..." />
      </div>
      <div class="form-group">
        <label>Link URL</label>
        <input type="text" name="linkUrl" [(ngModel)]="formData.linkUrl" placeholder="/" />
      </div>
      <div class="form-group">
        <label>Display Order</label>
        <input type="number" name="displayOrder" [(ngModel)]="formData.displayOrder" />
      </div>
      <button type="submit">Create Banner</button>
    </form>
  </div>

  <div *ngIf="isLoading">Loading banners...</div>

  <div class="banner-grid" *ngIf="!isLoading">
    <div class="banner-card" *ngFor="let banner of banners">
      <img [src]="banner.imageUrl" [alt]="banner.title" />
      <div class="banner-info">
        <strong>{{ banner.title || '(No title)' }}</strong>
        <p class="link">{{ banner.linkUrl }}</p>
        <span [class]="banner.isActive ? 'status-active' : 'status-inactive'">
          {{ banner.isActive ? 'Active' : 'Inactive' }}
        </span>
      </div>
      <div class="banner-actions">
        <button (click)="onToggleStatus(banner)">
          {{ banner.isActive ? 'Deactivate' : 'Activate' }}
        </button>
        <button class="danger" (click)="onDelete(banner)">Delete</button>
      </div>
    </div>
  </div>

  <p *ngIf="!isLoading && banners.length === 0">No banners yet.</p>
</div>
