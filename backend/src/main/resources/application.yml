server:
  port: 8081

spring:
  application:
    name: ecommerce-backend

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:ecommerce_user}
    password: ${DB_PASSWORD:Login@12}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-min-32-chars-please}
    expiration-ms: 86400000



logging:
  level:
    org.hibernate.SQL: debug
    org.flywaydb: DEBUG
    org.springframework.security: DEBUG